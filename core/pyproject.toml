[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alexandria-core"
version = "0.1.0"
description = "Framework-free recommendation algorithms shared by Alexandria's training pipeline and API."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["alexandria_core*"]
