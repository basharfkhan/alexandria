# Full local stack:  docker compose up --build
# Load the catalog:  docker compose run --rm api python -m app.seed --artifacts /artifacts
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: alexandria
      POSTGRES_PASSWORD: alexandria
      POSTGRES_DB: alexandria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://alexandria:alexandria@db:5432/alexandria
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789}
      CORS_ORIGINS: '["http://localhost:3000"]'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/artifacts:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
