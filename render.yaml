# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The database lives on Neon (serverless Postgres with pgvector); the web app on Vercel.
services:
  - type: web
    name: alexandria-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # postgresql+psycopg://<user>:<password>@<neon-host>/<db>?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. ["https://alexandria.vercel.app"]
      - key: ANTHROPIC_API_KEY
        sync: false
