# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The database lives on Neon (serverless Postgres with pgvector); the web app on Vercel.
services:
  - type: web
    name: alexandria-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string as-is (Connect -> pooling off); the driver prefix is added by the app
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # comma-separated, e.g. https://alexandria.vercel.app,http://localhost:3000
      - key: ANTHROPIC_API_KEY
        sync: false
