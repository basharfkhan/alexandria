name: Retrain

# Weekly retraining with a promotion gate: a new model only reaches production if it does not
# regress against the live one (ml/alexandria_ml/registry.py). Run it by hand from the Actions tab
# with "Run workflow".
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: "Seed the database when the model is promoted"
        type: boolean
        default: true

permissions:
  contents: write # commits the updated model registry

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Set this repository secret to let the workflow deploy a promoted model; without it the
      # run still trains, evaluates and records, and just skips the deploy step.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      # Ratings dump, embeddings and per-split BPR checkpoints: expensive, and safe to reuse.
      - name: Cache datasets and model caches
        uses: actions/cache@v4
        with:
          path: |
            ml/data
            ~/.cache/huggingface
          key: retrain-data-${{ hashFiles('ml/alexandria_ml/data/*.py', 'ml/alexandria_ml/features/*.py') }}
          restore-keys: retrain-data-

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./core "./ml[sbert,tracking]" ./api

      - name: Train
        working-directory: ml
        env:
          ALEXANDRIA_DISABLE_MLFLOW: "1"
        run: python -m alexandria_ml.pipeline

      - name: Promotion gate
        id: promote
        continue-on-error: true # the summary and artifacts are useful either way
        working-directory: ml
        run: python -m alexandria_ml.promote --artifacts artifacts

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ steps.promote.outputs.model_version || github.run_id }}
          path: |
            ml/artifacts/manifest.json
            ml/artifacts/ranker.txt
            ml/model_registry.json
          retention-days: 30

      - name: Deploy promoted model
        # Seeding upserts the catalog; the API hot-reloads within a minute (no redeploy).
        if: steps.promote.outputs.promote == 'true' && inputs.deploy != false && env.DATABASE_URL != ''
        working-directory: api
        run: python -m app.seed --artifacts ../ml/artifacts

      - name: Commit registry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/model_registry.json
          git diff --staged --quiet || git commit -m "Record retraining run ${{ steps.promote.outputs.model_version }}"
          git push

      - name: Fail if the model was rejected
        if: steps.promote.outcome == 'failure'
        run: |
          echo "::error::New model regressed against production - it was recorded but not promoted."
          exit 1
