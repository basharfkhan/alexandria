name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./core -e "./ml[dev]" -e "./api[dev]"
      - name: Ruff
        run: ruff check core ml api
      - name: Core tests
        run: pytest -q core/tests
      - name: ML pipeline tests (synthetic data)
        env:
          ALEXANDRIA_DISABLE_MLFLOW: "1"
        run: pytest -q ml/tests
      - name: API tests
        working-directory: api
        run: pytest -q

  postgres-integration:
    name: API against Postgres + pgvector
    runs-on: ubuntu-latest
    needs: python
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: alexandria
          POSTGRES_PASSWORD: alexandria
          POSTGRES_DB: alexandria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alexandria" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://alexandria:alexandria@localhost:5432/alexandria
      JWT_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      ALEXANDRIA_DISABLE_MLFLOW: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./core ./ml ./api
      - name: Train on synthetic data
        working-directory: ml
        run: python -m alexandria_ml.pipeline --synthetic --embedder tfidf --epochs 5 --batch-size 2048
      - name: Seed Postgres
        working-directory: api
        run: python -m app.seed --artifacts ../ml/artifacts
      - name: Smoke test
        working-directory: api
        run: |
          uvicorn app.main:app --port 8000 &
          timeout 30 bash -c 'until curl -sf localhost:8000/health; do sleep 1; done'
          TOKEN=$(curl -sf -X POST localhost:8000/auth/register -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","password":"ci-password"}' | python -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf localhost:8000/books/1/similar?limit=5 | python -c 'import sys,json; assert len(json.load(sys.stdin))==5'
          curl -sf -X POST localhost:8000/me/onboarding -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"genres":["fantasy"],"loved_book_ids":[1,2]}'
          curl -sf "localhost:8000/me/recommendations?limit=10" -H "Authorization: Bearer $TOKEN" \
            | python -c 'import sys,json; d=json.load(sys.stdin); assert len(d["items"])==10; print(d["personalization"])'

  web:
    name: Web - lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` generates route types (e.g. LayoutProps) and type-checks the app.
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
